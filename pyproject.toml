[build-system]
build-backend = "setuptools.build_meta"
requires      = [ "setuptools>=61.0" ]

[project]
authors = [ { name = "Brian Gray", email = "bgraymusic@gmail.com" } ]
dependencies = [
    "cffi>=1.17.0,<2.0.0",
    "cryptography>=43.0.0,<44.0.0",
    "deepmerge>=2.0,<3.0",
    "pyyaml>=6.0.0,<7.0.0",
    "requests>=2.32.0,<3.0.0",
]
name = "bgm-nerdrock"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "1.1"

    [project.scripts]
    bgnr = "cli.bgnr_cli:cli"

    [project.optional-dependencies]
    cdk = [ "aws-cdk-lib>=2.225.0,<3.0.0", "constructs>=10.4.0,<11.0.0", "gitpython>=3.1.44,<4.0.0" ]
    cli = [ "boto3-stubs[essential]>=1.40.75<2.0", "boto3[crt]>=1.36.24,<2.0.0", "colorama>=0.4.6,<1.0.0" ]
    test = [
        "aws-cdk-lib>=2.171.1,<3.0.0",
        "boto3[crt]>=1.35.0,<2.0.0",
        "constructs>=10.4.0,<11.0.0",
        "flake8-pyproject>=1.2.0,<2.0.0",
        "pycodestyle>=2.12.0,<3.0.0",
        "pytest-cov>=6.0.0,<7.0.0",
        "pytest-flake8>=1.3.0,<2.0.0",
        "pytest-mock>=3.14,<4.0",
        "pytest-pycodestyle>=2.4.0,<3.0.0",
        "pytest>=8.3.0,<9.0.0",
    ]

[tool.setuptools]
include-package-data = true
packages = [
    "api",
    "api.runtime",
    "api.runtime.badges",
    "api.runtime.database",
    "api.runtime.discography",
    "cdk",
    "cli",
    "cli.commands",
]

    [tool.setuptools.package-data]
    "*" = [ "*.json", "*.yml" ]

    [tool.setuptools.exclude-package-data]
    tests = [ "api/test" ]

[tool.pytest.ini_options]
minversion = "8.0"
# required_plugins = ["pytest-cov", "pytest-flake8"]
required_plugins = [ "pytest-cov" ]
# addopts = "--cache-clear --import-mode=importlib --cov='api' --flake8"
addopts      = "--cache-clear --import-mode=importlib --cov='api'"
python_files = "test_*.py"
pythonpath   = "."
testpaths    = [ "api/test" ]

[tool.coverage.run]
# include = ["api"]
branch = true
omit   = [ "**/infrastructure.py", "**/test/*", "cdk.py", "db/*", "refresh_database.py", "web/*" ]

[tool.coverage.report]
exclude_lines = [ "^\\s*handle\\({}, {}\\)\\s*$", "^\\s*pass\\s*$" ]
fail_under    = 80
precision     = 1
show_missing  = true

[tool.flake8]
exclude         = [ "api/test/**" ]
max-line-length = 120
