name: On Trunk Changed (Push or Merged Pull Request)

on:
  push:
    branches: [trunk]
  pull_request:
    types: [closed]
    branches: [trunk]

defaults:
  run:
    shell: bash -v {0}

jobs:
  go-no-go:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.go-no-go.outputs.go }}

    steps:
      - id: go-no-go
        run: |
          if [[ ${{ github.event_name }} -eq push || (${{ github.event_name }} -eq pull_request && ${{ github.event.pull_request.merged }} -eq true) ]]; then
            echo "go=true" >> GITHUB_OUTPUT;
          else
            echo "go=false" >> GITHUB_OUTPUT;
          fi

  deploy-nerdrock:
    runs-on: ubuntu-latest
    needs: go-no-go
    if: needs.go-no-go.outputs.go == true

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy
        run: make deploy ENV=staging
